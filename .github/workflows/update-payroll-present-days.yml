name: Update Payroll Present Days
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update payroll labels and paid-day display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements = [
            ('<th>Paid Days</th>', '<th>Present Days</th>'),
            ('<th>Paid Days</th><th>Gross Pay</th>', '<th>Present Days</th><th>Gross Pay</th>'),
          ]
          for a,b in replacements:
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show present days in payroll records'
          git push
