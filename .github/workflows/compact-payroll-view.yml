name: Compact Payroll View
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply compact payroll layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* Compact Payroll Records View v1 */'
          if marker not in s:
              css = '''\n/* Compact Payroll Records View v1 */\n#payrollTable .expense-table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}\n#payrollTable table{width:100%;min-width:0;table-layout:auto}\n#payrollTable th,#payrollTable td{padding:8px 6px;font-size:11px;line-height:1.25;white-space:nowrap;vertical-align:middle}\n#payrollTable th{font-size:10.5px;letter-spacing:-.1px;white-space:normal}\n#payrollTable td:nth-child(2){font-weight:600}\n#payrollTable td:nth-child(4),#payrollTable td:nth-child(10),#payrollTable td:nth-child(17),#payrollTable td:nth-child(18){font-weight:700}\n#payrollTable td:last-child{min-width:150px}\n#payrollTable td:last-child .btn{padding:5px 7px;font-size:10px;border-radius:8px;margin:1px}\n#payrollTable .status{font-size:10px;padding:4px 7px}\n@media(min-width:1000px){#payrollTable th,#payrollTable td{padding-left:5px;padding-right:5px}#payrollTable th{font-size:10px}#payrollTable td{font-size:11px}}\n@media(max-width:700px){#payrollTable .expense-table-wrap{border-radius:10px}#payrollTable th,#payrollTable td{padding:7px 5px;font-size:10.5px}#payrollTable td:last-child{min-width:135px}}\n'''
              s = s.replace('</style>', css + '</style>', 1)
          replacements = {
            '<th>Food Allowance</th>':'<th>Food</th>',
            '<th>Other Allowance</th>':'<th>Other</th>',
            '<th>Advance Payment</th>':'<th>Advance</th>',
            '<th>Other Deduction</th>':'<th>Other Ded</th>',
            '<th>Total Deduction</th>':'<th>Total Ded</th>',
            '<th>Payment</th>':'<th>Status</th>',
            '<th>Actions</th>':'<th>Action</th>'
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact payroll records view' || exit 0
          git rm .github/workflows/compact-payroll-view.yml
          git commit -m 'Remove temporary payroll layout workflow'
          git push
